name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      rc_run_id:
        description: Successful Desktop Release Candidate workflow run ID
        required: true
      tag:
        description: Stable tag, for example v0.20.0
        required: true

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require a successful RC workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          test "$(gh run view "${{ inputs.rc_run_id }}" --repo "${{ github.repository }}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${{ inputs.rc_run_id }}" --repo "${{ github.repository }}" --json workflowName --jq .workflowName)" = "Desktop Release Candidate"
      - name: Download the approved RC artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.rc_run_id }}" --repo "${{ github.repository }}" --dir artifacts
      - name: Validate RC manifest
        id: manifest
        shell: bash
        run: |
          sha=$(node scripts/release-contract.mjs validate-manifest --manifest artifacts/rc-metadata/release-manifest.json --repository "${{ github.repository }}" --tag "${{ inputs.tag }}" --run-id "${{ inputs.rc_run_id }}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require the RC commit on main
        shell: bash
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "${{ steps.manifest.outputs.sha }}" origin/main
      - name: Verify source version
        run: |
          git checkout --detach "${{ steps.manifest.outputs.sha }}"
          node scripts/release-contract.mjs validate-version --root . --version "${{ inputs.tag }}"
      - name: Prepare and checksum public assets
        run: node scripts/release-contract.mjs prepare-assets --input artifacts --output publish
      - name: Create immutable tag
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "${{ inputs.tag }}")" = "${{ steps.manifest.outputs.sha }}"
          else
            git tag -a "${{ inputs.tag }}" "${{ steps.manifest.outputs.sha }}" -m "Nomi ${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          fi
      - name: Publish the exact RC artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ inputs.tag }}" publish/*
          --repo "${{ github.repository }}"
          --verify-tag
          --title "Nomi ${{ inputs.tag }}"
          --generate-notes
